name: tests & docs

# Feature branches land in dev, and dev goes to main for a release. With only
# main listed here, no feature PR was ever tested — the second time CI has been
# switched off by a branch name without anything erroring (see the roadmap's
# operational notes). The docs job below still deploys from main alone.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                  # a rapid second push cancels the first deploy
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv installs the interpreter from .python-version (3.13, the one every
      # artifact was produced with) and the exact versions from uv.lock. On
      # Linux the lock resolves torch to PyTorch's CPU wheels — pyproject.toml
      # says why — so there is no separate torch step any more.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.1"

      # --locked fails when uv.lock no longer matches pyproject.toml, instead
      # of quietly resolving something new. All four groups install, the
      # showcase's included, so no test is skipped for a missing import.
      - name: Install the locked environment
        run: uv sync --locked

      - name: Run the contract tests
        run: uv run --locked pytest -q

      # --strict fails on a broken internal link; checked on every PR now, not
      # only on the push to main that deploys.
      - name: Build the docs
        run: uv run --locked mkdocs build --strict

      # Streamlit Cloud installs showcase/requirements.txt, which is exported
      # from the lock. An export nobody re-ran is a deploy that silently differs
      # from what was tested, so it is regenerated here and must not change.
      - name: Check the showcase requirements match the lock
        run: |
          uv export --locked --only-group showcase --no-hashes --no-emit-project \
            --format requirements-txt -o showcase/requirements.txt
          git diff --exit-code showcase/requirements.txt

  docs:
    needs: test               # never publish docs describing code that fails
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.1"
      - run: uv sync --locked --only-group dev

      # --strict fails on a broken internal link, so a bad cross-reference
      # breaks the build instead of shipping a dead link.
      - run: uv run --no-sync mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
