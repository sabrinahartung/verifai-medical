name: tests & docs

# Feature branches land in dev, and dev goes to main for a release. With only
# main listed here, no feature PR was ever tested — the second time CI has been
# switched off by a branch name without anything erroring (see the roadmap's
# operational notes). The docs job below still deploys from main alone.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                  # a rapid second push cancels the first deploy
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels on purpose: the default torch wheel pulls ~2.5 GB of CUDA for
      # a runner with no GPU. Installed before requirements-engine.txt so its
      # plain `torch` line is already satisfied.
      #
      # showcase/requirements.txt too: every showcase test starts with
      # importorskip("streamlit"), and without it twenty of them — the lineage
      # filter that must not widen a comparison among them — were skipped here
      # on every run while passing locally.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-engine.txt -r requirements-dev.txt -r showcase/requirements.txt

      - name: Run the contract tests
        run: pytest tests/ -q

  docs:
    needs: test               # never publish docs describing code that fails
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      # --strict fails on a broken internal link, so a bad cross-reference
      # breaks the build instead of shipping a dead link.
      - run: mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
